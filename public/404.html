<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Prostaff Solution</title>
    <meta name="theme-color" content="#0F1115" />
    <!-- The BASE placeholders are replaced with the site base path at build time (see vite.config.js) -->
    <link rel="icon" type="image/svg+xml" href="%BASE%favicon.svg" />
    <link href="%BASE%fonts/fonts.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem;
        background: #0f1115;
        color: #fbf8f3;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      img {
        width: 3.5rem;
        height: 3.5rem;
      }
      .eyebrow {
        margin: 0;
        color: #d9be8b;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: #b9b2a5;
        line-height: 1.7;
      }
      a {
        margin-top: 0.5rem;
        padding: 0.75rem 1.75rem;
        border: 1px solid rgba(184, 149, 90, 0.6);
        border-radius: 9999px;
        color: #d9be8b;
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:hover,
      a:focus-visible {
        background: rgba(184, 149, 90, 0.15);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <img src="%BASE%logo-mark.svg" alt="" />
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for has moved or no longer exists.</p>
    <a href="%BASE%">Back to Prostaff Solution</a>
  </body>
</html>
