# Netlify reads this automatically when the site is connected from Git.
# Response headers live in public/_headers (copied into dist/), so they also apply to drag-and-drop uploads.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The contact form posts to Netlify Forms (the hidden "enquiry" form in index.html). Netlify emails the
# inbox; the visitor is not kept waiting. Keep the form notification on under Forms > Form submission notifications.
# Netlify serves dist/404.html for unknown URLs automatically.
